# Публичные значения Helm-чарта демо-приложений для статьи про Coroot.
# Образы собираются из apps/ и публикуются в GHCR (см. .github/workflows/docker.yml).

# Реестр, из которого тянутся образы приложений.
imageRegistry: ghcr.io/patsevanton/coroot-kubernetes-observability

# Трейсы уходят напрямую в Coroot (OTLP over HTTP) — сервис coroot-coroot на порту
# 8080 принимает OTLP по пути /v1/traces. Значения заданы в env каждого приложения ниже.

# --- Генераторы нагрузки (бесконечные Job) ---
# На каждое включённое приложение создаётся Job load-<app>, который в цикле
# дёргает его проблемные эндпоинты (пути — load.paths в блоке приложения).
load:
  enabled: true
  image: curlimages/curl
  tag: latest
  pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# --- Демо 1: Nuxt (Node.js), CPU-bound ---
nuxt:
  enabled: true
  replicaCount: 1
  image:
    repository: nuxt
    tag: "1.3.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  env:
    # Символизация JS-фреймов в eBPF CPU-профиле Coroot (perf-map).
    NODE_OPTIONS: "--perf-basic-prof-only-functions --interpreted-frames-native-stack"
    # Трейсы: экспорт OTLP в Coroot (server-span + вложенный span на вычисление).
    OTEL_SERVICE_NAME: "demo-nuxt"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://coroot-coroot.coroot:8080/v1/traces"
    OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
    OTEL_METRICS_EXPORTER: "none"
    OTEL_LOGS_EXPORTER: "none"
  podAnnotations: {}
  # Пути для генератора нагрузки (по одному запросу за итерацию, по кругу).
  load:
    paths:
      - /api/cpu
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Демо 2: Python, CPU-bound ---
python:
  enabled: true
  replicaCount: 1
  image:
    repository: python
    tag: "1.3.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  env:
    # Трейсы: opentelemetry-instrument экспортирует OTLP-спаны в Coroot.
    OTEL_SERVICE_NAME: "demo-python"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://coroot-coroot.coroot:8080/v1/traces"
    OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
  podAnnotations: {}
  load:
    paths:
      - /cpu
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Демо 3: Go, утечка памяти и горутин ---
golang:
  enabled: true
  replicaCount: 1
  image:
    repository: golang
    tag: "1.3.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  env:
    # Трейсы: otelhttp оборачивает маршрутизатор, OTLP-экспорт напрямую в Coroot.
    OTEL_SERVICE_NAME: "demo-golang"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://coroot-coroot.coroot:8080/v1/traces"
    OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
  # Включаем pprof-скрейп (CPU/blocking/mutex) через cluster-agent.
  # /debug/pprof доступен благодаря import _ "net/http/pprof".
  podAnnotations:
    coroot.com/profile-scrape: "true"
    coroot.com/profile-port: "8080"
  load:
    paths:
      - /leak
      - /cpu
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 2Gi

# --- Демо 4: Java, CPU, аллокации и блокировки ---
java:
  enabled: true
  replicaCount: 1
  image:
    repository: java
    tag: "1.3.1"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  env:
    # Трейсы: OTel javaagent (см. apps/java/Dockerfile) экспортирует спаны в Coroot.
    OTEL_SERVICE_NAME: "demo-java"
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://coroot-coroot.coroot:8080/v1/traces"
    OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "http/protobuf"
    OTEL_METRICS_EXPORTER: "none"
    OTEL_LOGS_EXPORTER: "none"
  podAnnotations: {}
  load:
    paths:
      - /cpu
      - /alloc
      - /lock
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
