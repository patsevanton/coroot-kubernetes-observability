apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-nuxt
  namespace: demo
  labels:
    app: demo-nuxt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-nuxt
  template:
    metadata:
      labels:
        app: demo-nuxt
    spec:
      containers:
        - name: demo-nuxt
          image: demo-nuxt:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Символизация JS-фреймов в eBPF CPU-профиле Coroot
            - name: NODE_OPTIONS
              value: "--perf-basic-prof-only-functions --interpreted-frames-native-stack"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-nuxt
  namespace: demo
  labels:
    app: demo-nuxt
spec:
  selector:
    app: demo-nuxt
  ports:
    - port: 3000
      targetPort: 3000
      name: http
