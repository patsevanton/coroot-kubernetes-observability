mode: deployment

# Короткое и предсказуемое имя ресурсов (иначе будет <release>-opentelemetry-collector).
fullnameOverride: otel-collector

image:
  repository: otel/opentelemetry-collector-contrib

# Только HTTP-приёмник трейсов; jaeger/zipkin/grpc/метрики не нужны.
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: true
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# Полный конфиг коллектора (без слияния со стандартными jaeger/zipkin/prometheus).
# health_check обязателен — на него завязаны liveness/readiness-пробы чарта (порт 13133).
alternateConfig:
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
  processors:
    batch: {}
  exporters:
    otlp_http/coroot:
      endpoint: "http://coroot-coroot.coroot:8080"
  service:
    extensions:
      - health_check
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp_http/coroot]